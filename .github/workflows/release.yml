name: Release

# Pushing a cm-X.Y.Z tag releases it. The tag must match Cargo.toml's version and point at a commit
# on main. A release created with GITHUB_TOKEN fires no workflow, so this run also pushes the tap formula.

on:
  push:
    tags: ["cm-*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: check the tag
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! $TAG =~ ^cm-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not cm-<major>.<minor>.<patch>"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ $declared != "$version" ]]; then
            echo "::error::tag $TAG does not match Cargo.toml version $declared"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG does not point at a commit on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $TAG from $GITHUB_SHA"

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cm
          key: ${{ hashFiles('rust-toolchain.toml') }}-${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package and check the binary
        shell: bash
        run: |
          set -euo pipefail
          archive="cm-$VERSION-$TARGET"
          mkdir -p "staging/$archive"
          cp "target/$TARGET/release/cm" README.md LICENSE-APACHE LICENSE-MIT "staging/$archive/"
          tar -C staging -czf "$archive.tar.gz" "$archive"
          shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256"
          # The unversioned copy is what releases/latest/download/cm-$TARGET.tar.gz serves.
          cp "$archive.tar.gz" "cm-$TARGET.tar.gz"
          shasum -a 256 "cm-$TARGET.tar.gz" > "cm-$TARGET.tar.gz.sha256"
          mkdir unpacked
          tar -C unpacked -xzf "$archive.tar.gz"
          test "$("unpacked/$archive/cm" --version)" = "cm $VERSION"
          "unpacked/$archive/cm" init unpacked/campaign
          "unpacked/$archive/cm" lint unpacked/campaign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cm-${{ matrix.target }}
          path: |
            cm-*.tar.gz
            cm-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish cm-${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cm-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "cm-$VERSION" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "cm-$VERSION" --generate-notes

  tap:
    name: update the Homebrew tap
    needs: [version, release]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEKOPON_RELEASE_APP_ID }}
          private-key: ${{ secrets.DEKOPON_RELEASE_APP_KEY }}
          owner: dekopon-agents
          repositories: homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dekopon-agents/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap
      - name: Render and push Formula/cm.rb
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "cm-$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "cm-$VERSION-*.tar.gz.sha256" --dir checksums
          python3 source/.github/scripts/render-homebrew-formula.py \
            --repository "$GITHUB_REPOSITORY" --tag "cm-$VERSION" \
            --checksums checksums --output tap/Formula/cm.rb
          cd tap
          git add Formula/cm.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula/cm.rb already matches cm-$VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update cm to $VERSION"
          git push origin HEAD:main
